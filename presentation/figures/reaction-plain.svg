<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Inter, Arial, sans-serif">
  <!-- Dr. Galactic: the "reaction" a long Mars mission sets off, for the presentation.
       Made with AI assistance (Claude Code, Anthropic). Remove the group id="inhibitor" for the plain version. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#16181f"/>
      <stop offset="1" stop-color="#08090c"/>
    </radialGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="1228" x2="1508" y1="530" y2="530">
      <stop offset="0" stop-color="#8e9bc7"/>
      <stop offset="1" stop-color="#ff4a3d"/>
    </linearGradient>
    <g id="plus"><text text-anchor="middle" font-size="64" font-weight="300" fill="#8b8f9c">+</text></g>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- title -->
  <text x="105" y="150" font-size="56" font-weight="700" fill="#f2f3f7" letter-spacing="-1">The reaction a long space mission sets off</text>
  <text x="105" y="200" font-size="26" fill="#a3a6b4">Months of these together can lead to depression, and Earth is too far away to see it coming.</text>

  <!-- reactant 1: environment -->
  <g transform="translate(105 380)">
    <rect width="230" height="300" rx="14" fill="#15161b" stroke="#8e9bc7" stroke-width="3"/>
    <text x="18" y="38" font-size="22" fill="#8b8f9c">01</text>
    <text x="115" y="152" text-anchor="middle" font-size="104" font-weight="700" fill="#b9c3e6">En</text>
    <text x="115" y="204" text-anchor="middle" font-size="24" font-weight="600" fill="#ececf1">Environment</text>
    <text x="115" y="236" text-anchor="middle" font-size="17" fill="#a3a6b4">changes drastically:</text>
    <text x="115" y="260" text-anchor="middle" font-size="17" fill="#a3a6b4">microgravity, no sunrise</text>
  </g>
  <use href="#plus" x="365" y="552"/>

  <!-- reactant 2: isolation -->
  <g transform="translate(395 380)">
    <rect width="230" height="300" rx="14" fill="#15161b" stroke="#b9c8f2" stroke-width="3"/>
    <text x="18" y="38" font-size="22" fill="#8b8f9c">02</text>
    <text x="115" y="152" text-anchor="middle" font-size="104" font-weight="700" fill="#d3dcf7">Is</text>
    <text x="115" y="204" text-anchor="middle" font-size="24" font-weight="600" fill="#ececf1">Isolation</text>
    <text x="115" y="236" text-anchor="middle" font-size="17" fill="#a3a6b4">4 people, up to</text>
    <text x="115" y="260" text-anchor="middle" font-size="17" fill="#a3a6b4">22 min from Earth</text>
  </g>
  <use href="#plus" x="655" y="552"/>

  <!-- reactant 3: sleep deprivation -->
  <g transform="translate(685 380)">
    <rect width="230" height="300" rx="14" fill="#15161b" stroke="#6f8fe6" stroke-width="3"/>
    <text x="18" y="38" font-size="22" fill="#8b8f9c">03</text>
    <text x="115" y="152" text-anchor="middle" font-size="104" font-weight="700" fill="#9fb4f0">Sd</text>
    <text x="115" y="204" text-anchor="middle" font-size="24" font-weight="600" fill="#ececf1">Sleep deprivation</text>
    <text x="115" y="236" text-anchor="middle" font-size="17" fill="#a3a6b4">about 6 h a night</text>
    <text x="115" y="260" text-anchor="middle" font-size="17" fill="#a3a6b4">in orbit</text>
  </g>
  <use href="#plus" x="945" y="552"/>

  <!-- reactant 4: high stress -->
  <g transform="translate(975 380)">
    <rect width="230" height="300" rx="14" fill="#15161b" stroke="#e0705b" stroke-width="3"/>
    <text x="18" y="38" font-size="22" fill="#8b8f9c">04</text>
    <text x="115" y="152" text-anchor="middle" font-size="104" font-weight="700" fill="#f0a49a">Hs</text>
    <text x="115" y="204" text-anchor="middle" font-size="24" font-weight="600" fill="#ececf1">High stress</text>
    <text x="115" y="236" text-anchor="middle" font-size="17" fill="#a3a6b4">workload, confinement,</text>
    <text x="115" y="260" text-anchor="middle" font-size="17" fill="#a3a6b4">conflict</text>
  </g>

  <!-- arrow and its condition: time -->
  <text x="1365" y="478" text-anchor="middle" font-size="44" font-weight="700" fill="#f2f3f7">Δt</text>
  <text x="1365" y="506" text-anchor="middle" font-size="18" fill="#a3a6b4">long periods of time</text>
  <line x1="1228" y1="530" x2="1482" y2="530" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round"/>
  <polygon points="1478,512 1508,530 1478,548" fill="#ff4a3d"/>

  <!-- what slows it: written under the arrow, like an inhibitor in chemistry -->

  <!-- product -->
  <g transform="translate(1525 360)">
    <rect width="290" height="340" rx="16" fill="#1d0f10" stroke="#d62828" stroke-width="4"/>
    <text x="20" y="40" font-size="22" fill="#b88a85">05</text>
    <text x="145" y="168" text-anchor="middle" font-size="124" font-weight="700" fill="#ff5a4f">Dp</text>
    <text x="145" y="222" text-anchor="middle" font-size="30" font-weight="700" fill="#ffffff">Depression</text>
    <text x="145" y="256" text-anchor="middle" font-size="19" fill="#e2b8b3">and other mental</text>
    <text x="145" y="280" text-anchor="middle" font-size="19" fill="#e2b8b3">health issues</text>
  </g>

  <!-- sources -->
  <text x="105" y="1010" font-size="16" fill="#6f7280">Sleep about 6 h a night: Barger et al., Lancet Neurology 2014. Delay: Earth–Mars one-way light time, up to about 22 min. Risk: NASA Human Research Program, "Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders".</text>
</svg>
