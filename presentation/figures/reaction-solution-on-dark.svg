<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Inter, Arial, sans-serif">
<!-- Dr. Galactic presentation figure. Transparent background. Made with AI assistance (Claude Code, Anthropic). -->
<defs><linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="1228" x2="1508" y1="530" y2="530"><stop offset="0" stop-color="#c0c6d4"/><stop offset="1" stop-color="#d62828"/></linearGradient></defs>
<text x="105" y="150" font-size="56" font-weight="700" fill="#c0c6d4" letter-spacing="-1">The reaction a long space mission sets off</text>
<text x="105" y="200" font-size="26" fill="#c0c6d4" fill-opacity="0.75">Months of these together can lead to depression. Dr. Galactic catches it early.</text>
<g transform="translate(105 380)"><rect width="230" height="300" rx="18" fill="#1b3a8a" fill-opacity="0.35" stroke="#c0c6d4" stroke-width="3"/><g transform="translate(115 100)" stroke="#c0c6d4" fill="#c0c6d4"><circle r="24" fill="none" stroke-width="5"/><ellipse rx="38" ry="11" fill="none" stroke-width="5" transform="rotate(-20)"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#c0c6d4">Environment</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">changes drastically:</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">microgravity, no sunrise</text></g>
<text x="365" y="552" text-anchor="middle" font-size="64" font-weight="300" fill="#c0c6d4" fill-opacity="0.7">+</text>
<g transform="translate(395 380)"><rect width="230" height="300" rx="18" fill="#1b3a8a" fill-opacity="0.35" stroke="#c0c6d4" stroke-width="3"/><g transform="translate(115 100)" stroke="#c0c6d4" fill="#c0c6d4"><circle cy="-14" r="13" fill="none" stroke-width="5"/><path d="M-24 30 C-24 6 24 6 24 30" fill="none" stroke-width="5" stroke-linecap="round"/><circle r="38" fill="none" stroke-width="3" stroke-dasharray="4 7"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#c0c6d4">Isolation</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">4 people, up to</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">22 min from Earth</text></g>
<text x="655" y="552" text-anchor="middle" font-size="64" font-weight="300" fill="#c0c6d4" fill-opacity="0.7">+</text>
<g transform="translate(685 380)"><rect width="230" height="300" rx="18" fill="#1b3a8a" fill-opacity="0.35" stroke="#c0c6d4" stroke-width="3"/><g transform="translate(115 100)" stroke="#c0c6d4" fill="#c0c6d4"><path d="M10 -30 A30 30 0 1 0 30 12 A24 24 0 1 1 10 -30 Z" fill="none" stroke-width="5" stroke-linejoin="round"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#c0c6d4">Sleep deprivation</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">about 6 h a night</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">in orbit</text></g>
<text x="945" y="552" text-anchor="middle" font-size="64" font-weight="300" fill="#c0c6d4" fill-opacity="0.7">+</text>
<g transform="translate(975 380)"><rect width="230" height="300" rx="18" fill="#8f1f0f" fill-opacity="0.35" stroke="#8f1f0f" stroke-width="3"/><g transform="translate(115 100)" stroke="#d62828" fill="#d62828"><path d="M6 -34 L-18 4 L0 4 L-6 34 L18 -6 L0 -6 Z" fill="none" stroke-width="5" stroke-linejoin="round"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#c0c6d4">High stress</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">workload, confinement,</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#c0c6d4" fill-opacity="0.75">conflict</text></g>
<text x="1365" y="478" text-anchor="middle" font-size="44" font-weight="700" fill="#c0c6d4">Δt</text>
<text x="1365" y="506" text-anchor="middle" font-size="18" fill="#c0c6d4" fill-opacity="0.75">long periods of time</text>
<line x1="1228" y1="530" x2="1482" y2="530" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round"/>
<polygon points="1478,512 1508,530 1478,548" fill="#d62828"/>
<text x="1365" y="580" text-anchor="middle" font-size="16" fill="#c0c6d4" fill-opacity="0.75">caught early by</text><text x="1365" y="610" text-anchor="middle" font-size="26" font-weight="700" fill="#c0c6d4">Dr. Galactic</text>
<g transform="translate(1525 360)"><rect width="290" height="340" rx="20" fill="#8f1f0f" fill-opacity="0.45" stroke="#d62828" stroke-width="4"/><g transform="translate(145 110) scale(1.25)" stroke="#d62828" fill="#d62828"><path d="M-26 6 A14 14 0 0 1 -18 -20 A20 20 0 0 1 18 -22 A14 14 0 0 1 26 6 Z" fill="none" stroke-width="5" stroke-linejoin="round"/><path d="M-14 16 L-18 30 M2 16 L-2 30 M18 16 L14 30" stroke-width="5" stroke-linecap="round"/></g><text x="145" y="226" text-anchor="middle" font-size="32" font-weight="700" fill="#c0c6d4">Depression</text><text x="145" y="262" text-anchor="middle" font-size="19" fill="#c0c6d4">and other mental</text><text x="145" y="286" text-anchor="middle" font-size="19" fill="#c0c6d4">health issues</text></g>
<text x="105" y="1010" font-size="16" fill="#c0c6d4" fill-opacity="0.55">Sleep about 6 h a night: Barger et al., Lancet Neurology 2014. Delay: Earth–Mars one-way light time, up to about 22 min. Risk: NASA Human Research Program, "Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders".</text>
</svg>
