<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Segoe UI, Inter, Arial, sans-serif">
<!-- Dr. Galactic presentation figure. Transparent background. Made with AI assistance (Claude Code, Anthropic). -->
<defs><linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="1228" x2="1508" y1="530" y2="530"><stop offset="0" stop-color="#5a6aa8"/><stop offset="1" stop-color="#c41f1f"/></linearGradient></defs>
<text x="105" y="150" font-size="56" font-weight="700" fill="#14161c" letter-spacing="-1">The reaction a long space mission sets off</text>
<text x="105" y="200" font-size="26" fill="#4a4f5c">Months of these together can lead to depression, and Earth is too far away to see it coming.</text>
<g transform="translate(105 380)"><rect width="230" height="300" rx="18" fill="#000000" fill-opacity="0.03" stroke="#5a6aa8" stroke-width="3"/><g transform="translate(115 100)" stroke="#4a5a98" fill="#4a5a98"><circle r="24" fill="none" stroke-width="5"/><ellipse rx="38" ry="11" fill="none" stroke-width="5" transform="rotate(-20)"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#14161c">Environment</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#4a4f5c">changes drastically:</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#4a4f5c">microgravity, no sunrise</text></g>
<text x="365" y="552" text-anchor="middle" font-size="64" font-weight="300" fill="#6b6f7a">+</text>
<g transform="translate(395 380)"><rect width="230" height="300" rx="18" fill="#000000" fill-opacity="0.03" stroke="#6b7fc4" stroke-width="3"/><g transform="translate(115 100)" stroke="#5268b5" fill="#5268b5"><circle cy="-14" r="13" fill="none" stroke-width="5"/><path d="M-24 30 C-24 6 24 6 24 30" fill="none" stroke-width="5" stroke-linecap="round"/><circle r="38" fill="none" stroke-width="3" stroke-dasharray="4 7"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#14161c">Isolation</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#4a4f5c">4 people, up to</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#4a4f5c">22 min from Earth</text></g>
<text x="655" y="552" text-anchor="middle" font-size="64" font-weight="300" fill="#6b6f7a">+</text>
<g transform="translate(685 380)"><rect width="230" height="300" rx="18" fill="#000000" fill-opacity="0.03" stroke="#3d5fd0" stroke-width="3"/><g transform="translate(115 100)" stroke="#2f50c0" fill="#2f50c0"><path d="M10 -30 A30 30 0 1 0 30 12 A24 24 0 1 1 10 -30 Z" fill="none" stroke-width="5" stroke-linejoin="round"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#14161c">Sleep deprivation</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#4a4f5c">about 6 h a night</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#4a4f5c">in orbit</text></g>
<text x="945" y="552" text-anchor="middle" font-size="64" font-weight="300" fill="#6b6f7a">+</text>
<g transform="translate(975 380)"><rect width="230" height="300" rx="18" fill="#000000" fill-opacity="0.03" stroke="#c4513d" stroke-width="3"/><g transform="translate(115 100)" stroke="#b3432f" fill="#b3432f"><path d="M6 -34 L-18 4 L0 4 L-6 34 L18 -6 L0 -6 Z" fill="none" stroke-width="5" stroke-linejoin="round"/></g><text x="115" y="204" text-anchor="middle" font-size="25" font-weight="700" fill="#14161c">High stress</text><text x="115" y="238" text-anchor="middle" font-size="17" fill="#4a4f5c">workload, confinement,</text><text x="115" y="262" text-anchor="middle" font-size="17" fill="#4a4f5c">conflict</text></g>
<text x="1365" y="478" text-anchor="middle" font-size="44" font-weight="700" fill="#14161c">Δt</text>
<text x="1365" y="506" text-anchor="middle" font-size="18" fill="#4a4f5c">long periods of time</text>
<line x1="1228" y1="530" x2="1482" y2="530" stroke="url(#arrow)" stroke-width="6" stroke-linecap="round"/>
<polygon points="1478,512 1508,530 1478,548" fill="#c41f1f"/>
<g transform="translate(1525 360)"><rect width="290" height="340" rx="20" fill="#c41f1f" fill-opacity="0.07" stroke="#c41f1f" stroke-width="4"/><g transform="translate(145 110) scale(1.25)" stroke="#c41f1f" fill="#c41f1f"><path d="M-26 6 A14 14 0 0 1 -18 -20 A20 20 0 0 1 18 -22 A14 14 0 0 1 26 6 Z" fill="none" stroke-width="5" stroke-linejoin="round"/><path d="M-14 16 L-18 30 M2 16 L-2 30 M18 16 L14 30" stroke-width="5" stroke-linecap="round"/></g><text x="145" y="226" text-anchor="middle" font-size="32" font-weight="700" fill="#14161c">Depression</text><text x="145" y="262" text-anchor="middle" font-size="19" fill="#7a2a24">and other mental</text><text x="145" y="286" text-anchor="middle" font-size="19" fill="#7a2a24">health issues</text></g>
<text x="105" y="1010" font-size="16" fill="#6b6f7a">Sleep about 6 h a night: Barger et al., Lancet Neurology 2014. Delay: Earth–Mars one-way light time, up to about 22 min. Risk: NASA Human Research Program, "Adverse Cognitive or Behavioral Conditions and Psychiatric Disorders".</text>
</svg>
