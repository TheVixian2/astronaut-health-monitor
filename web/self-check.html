<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On board · Dr. Galactic</title>
  <script src="auth.js"></script>
  <!-- Archivo: one family at three widths (design system in style.css). Falls back to system-ui offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js via CDN (web/CLAUDE.md). The page still works if it fails to load. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body class="selfcheck">
  <!-- Astronaut console menu. DATA ONLY: no alerts, verdicts or advice here
       (warnings go to the Commander, the ship's doctor and Ground). Hidden inside demo.html. -->
  <nav class="appnav area-onboard" aria-label="On board">
    <a class="brand" data-href="index.html" href="index.html" title="Choose area">Dr. Galactic</a>
    <span class="area-tag">On board</span>
    <div class="menu">
      <a href="#health" data-tab-link="health">My health</a>
      <a href="#checkin" data-tab-link="checkin">Check-in</a>
      <a href="#sleep" data-tab-link="sleep">Sleep &amp; light</a>
      <a data-href="history.html" href="history.html">History</a>
      <a data-href="sources.html" href="sources.html">Data sources</a>
    </div>
    <div class="user small"><span data-user></span><span data-demo-only> <a data-href="index.html" href="index.html">All views</a></span> <button type="button" class="link" data-signout>Sign out</button></div>
  </nav>

  <header class="bar">
    <div>
      <h1>Astronaut console</h1>
      <div class="who"><strong id="name">…</strong> <span class="muted" id="role"></span></div>
    </div>
    <div class="status" aria-live="polite">
      <span id="conn" class="pill pill-wait">connecting…</span>
      <span><strong>Live</strong>, no delay</span>
      <span id="lightNote" class="light-note" hidden>Pre-sleep light: screen dimmed</span>
      <span id="mission"></span>
      <span>Updated <strong id="age">—</strong></span>
      <label class="muted small">Astronaut
        <select id="aid"><option>a1</option><option>a2</option><option>a3</option><option>a4</option></select>
      </label>
    </div>
  </header>


  <!-- The console's cards (body, vitals, check-in, sleep & light) come from
       consoleMarkup() in self-check.js, shared with captain.html and doctor.html. -->
  <main id="console" class="sc-grid"></main>

  <footer class="foot muted small">Your own data, against your own baseline. If something feels wrong, tell the Crew Medical Officer.</footer>

  <script src="mock.js"></script>
  <script src="common.js"></script>
  <script src="reaction-test.js"></script>
  <script src="self-check.js"></script>
</body>
</html>
