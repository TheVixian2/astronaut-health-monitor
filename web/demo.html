<!doctype html>
<!-- Written with AI assistance (Claude Code, Anthropic) and reviewed by the team. See README "Use of AI". -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo · Dr. Galactic</title>
  <script src="auth.js"></script>
  <!-- Archivo: one family at three widths (design system in style.css). Falls back to system-ui offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Loaded without blocking: a slow or missing network (offline on board) must never hold up the page's scripts. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Full-screen split for the live demo (presentation/demo-script.md). */
    body.demo { padding: 0 12px 12px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    .demo .bar { padding: 8px 0; }
    .demo-split { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
    .pane { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .pane-label { padding: 6px 12px; background: var(--panel); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
    .pane iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
    @media (max-width: 900px) {
      body.demo { height: auto; overflow: auto; }
      .demo-split { grid-template-columns: minmax(0, 1fr); }
      .pane iframe { height: 80vh; }
    }
  </style>
</head>
<body class="demo">
  <header class="bar">
    <h1><a href="index.html" class="home app-name">Dr. Galactic</a> <span class="muted">· live demo</span></h1>
    <span class="muted small">Left knows now. Right finds out one light-time later.</span>
  </header>
  <main class="demo-split">
    <section class="pane">
      <div class="pane-label"><strong>On board: the Commander</strong><span class="muted small">live</span></div>
      <iframe id="selfFrame" title="Commander view"></iframe>
    </section>
    <section class="pane">
      <div class="pane-label"><strong>On Earth: Mission Control</strong><span class="muted small">delayed by light time</span></div>
      <iframe id="groundFrame" title="Ground view"></iframe>
    </section>
  </main>
  <script src="common.js"></script>
  <script>
    // Same ?mock / ?base / ?aid for both panes.
    // Left pane: the Commander, who now learns first on board (crew consoles show
    // data only, no warnings).
    document.getElementById("selfFrame").src = AHM.linkWithSettings("captain.html") + "#crew";   // the Crew wellbeing tab
    document.getElementById("groundFrame").src = AHM.linkWithSettings("ground.html");
  </script>
</body>
</html>
