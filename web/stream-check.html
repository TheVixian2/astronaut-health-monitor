<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Raw stream · AHM</title>
  <script src="auth.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!--
    Debug tool in the Ground menu: connects to /astronauts/{id}/stream over SSE
    and prints every event. Open with ?mock to run without a backend.
  -->
  <nav class="appnav area-ground" aria-label="Ground">
    <a class="brand" data-href="index.html" href="index.html" title="Choose area">AHM</a>
    <span class="area-tag">Ground</span>
    <div class="menu">
      <a data-href="ground.html" href="ground.html">Crew overview</a>
      <a data-href="stream-check.html" href="stream-check.html" aria-current="page">Raw stream (debug)</a>
    </div>
    <div class="user small"><span data-user></span><span data-demo-only> · <a data-href="index.html" href="index.html">All views</a></span> · <button type="button" class="link" data-signout>Sign out</button></div>
  </nav>

  <header class="bar">
    <h1>Raw stream <span class="muted">· debug</span></h1>
    <form id="controls" class="controls">
      <label>Backend <input id="base" value="http://localhost:8000" size="22"></label>
      <label>Astronaut
        <select id="aid">
          <option>a1</option><option>a2</option><option>a3</option><option>a4</option>
        </select>
      </label>
      <label>View
        <select id="view">
          <option value="crew">crew (Self-check, live)</option>
          <option value="ground">ground (delayed)</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="mock"> Mock data</label>
      <button type="submit">Connect</button>
    </form>
  </header>

  <section class="status" aria-live="polite">
    <span id="conn" class="pill pill-off">disconnected</span>
    <span id="viewLabel"></span>
    <span id="mission"></span>
    <span>Data age: <strong id="age">—</strong></span>
  </section>

  <main class="grid">
    <section class="card">
      <h2>Latest vitals <span class="muted">vs. personal baseline</span></h2>
      <table id="vitals">
        <thead><tr><th>Signal</th><th>Now</th><th>Baseline</th><th>Δ</th></tr></thead>
        <tbody><tr><td colspan="4" class="muted">Waiting for a <code>vitals</code> event…</td></tr></tbody>
      </table>
      <p class="muted small" id="vitalsMeta"></p>
    </section>

    <section class="card">
      <h2>Alerts</h2>
      <ul id="alerts" class="alerts"><li class="muted">No alerts yet.</li></ul>
    </section>

    <section class="card wide">
      <h2>Raw events <button type="button" id="clearLog" class="link">clear</button></h2>
      <pre id="log" class="log"></pre>
    </section>
  </main>

  <script src="mock.js"></script>
  <script src="common.js"></script>
  <script src="stream-check.js"></script>
</body>
</html>
